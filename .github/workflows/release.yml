name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create Release via Forgejo / GitHub API
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_URL: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 - << 'EOF'
          import json
          import os
          import urllib.request

          api_url = os.environ["API_URL"].rstrip("/").replace("http://server:3000", "http://192.168.1.9:3100")
          repo = os.environ["REPO"]
          tag = os.environ["TAG"]
          token = os.environ["TOKEN"]

          payload = json.dumps({
              "tag_name": tag,
              "name": f"VK Notify Plus {tag}",
              "body": f"Release {tag}",
              "draft": False,
              "prerelease": False,
          }).encode("utf-8")

          req = urllib.request.Request(
              f"{api_url}/repos/{repo}/releases",
              data=payload,
              headers={
                  "Authorization": f"token {token}",
                  "Content-Type": "application/json",
                  "Accept": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              print(f"Release {tag} created successfully (HTTP {resp.status})")
          EOF

