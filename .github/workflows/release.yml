name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create Release via Forgejo / GitHub API
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_URL: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 - << 'EOF'
          import json
          import os
          import urllib.request

          api_url = os.environ["API_URL"].rstrip("/").replace("http://server:3000", "http://192.168.1.9:3100")
          repo = os.environ["REPO"]
          tag = os.environ["TAG"]
          token = os.environ["TOKEN"]

          body = (
              f"## VK Notify {tag}\n\n"
              "- Иерархия **«Сообщество (Бот ВК) → Чаты» (`ConfigSubentry`)**: добавление чатов кнопкой «Добавить чат» без повторного ввода токена и мультивыбор чатов при настройке.\n"
              "- Прямая отправка снимков с одной или нескольких камер Home Assistant (`camera_entity`, до 10 камер одним сообщением-альбомом) в оперативной памяти без записи на диск.\n"
              "- Автоматическое определение MIME-типа по magic bytes (`JPEG`, `PNG`, `GIF`, `WebP`, `BMP`), восстановление обрезанных RTSP-кадров (`LOAD_TRUNCATED_IMAGES`), ресайз до `2560 px` и перекодирование в `baseline RGB JPEG`.\n"
              "- Поддержка `media-source://` и `url` для отправки документов.\n"
              "- Приём входящих вложений (`attachments`), геолокации (`geo`) и текстовой расшифровки голосовых сообщений (`transcript`) в Long Poll.\n"
              "- Выгрузка обезличенной диагностики (`diagnostics.py`) и автоматическое маскирование токенов/паролей/хэшей в логах.\n"
              "- Полная совместимость с **Home Assistant 2026.11+** и **VK API v5.199**."
          )

          payload = json.dumps({
              "tag_name": tag,
              "name": f"VK Notify {tag}",
              "body": body,
              "draft": False,
              "prerelease": False,
          }).encode("utf-8")

          req = urllib.request.Request(
              f"{api_url}/repos/{repo}/releases",
              data=payload,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "User-Agent": "ha-vk-notify-plus-release",
              },
              method="POST",
          )
          import urllib.error

          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  print(f"Release {tag} created successfully (HTTP {resp.status})")
          except urllib.error.HTTPError as err:
              if err.code in (409, 422):
                  print(f"Release {tag} already exists (HTTP {err.code}), skipping creation")
              else:
                  raise
          EOF

