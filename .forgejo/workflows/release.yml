name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        env:
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FIXED_URL=$(echo "$SERVER_URL" | sed 's|http://server:3000|http://192.168.1.9:3100|g')
          AUTH_URL=$(echo "$FIXED_URL" | sed "s|://|://x-access-token:${TOKEN}@|")
          git config --global init.defaultBranch main
          git config --global --add safe.directory "$PWD"
          git init .
          git remote add origin "${AUTH_URL}/${REPO}.git"
          git fetch --depth=1 origin "$SHA"
          git checkout -q FETCH_HEAD

      - name: Create Release & Upload vk_notify.zip via Forgejo API
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_URL: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 - << 'EOF'
          import io
          import json
          import os
          import pathlib
          import urllib.error
          import urllib.request
          import zipfile

          api_url = os.environ["API_URL"].rstrip("/").replace("http://server:3000", "http://192.168.1.9:3100")
          repo = os.environ["REPO"]
          tag = os.environ["TAG"]
          token = os.environ["TOKEN"]

          src_dir = pathlib.Path("custom_components/vk_notify")
          zip_buf = io.BytesIO()
          with zipfile.ZipFile(zip_buf, "w", zipfile.ZIP_DEFLATED) as zf:
              for p in sorted(src_dir.rglob("*")):
                  if p.is_file() and "__pycache__" not in p.parts and not p.name.endswith((".pyc", ".DS_Store")):
                      zf.write(p, p.relative_to(src_dir).as_posix())
          zip_bytes = zip_buf.getvalue()

          body = (
              f"## VK Notify {tag}\n\n"
              "- Packaged `vk_notify.zip` release asset (`zip_release: true` in `hacs.json`) for HACS / Marketplace download tracking.\n"
              "- **Community (Bot) → Chats (`ConfigSubentry`)** hierarchy, parallel multi-camera album capture (`camera_entity`, up to 10 cameras) with automatic upload node retries & PNG fallback, Long Poll incoming attachments & voice transcripts (`transcript`), and full compatibility with **Home Assistant 2025.8+ / 2026.x** and **VK API v5.199**."
          )

          payload = json.dumps({
              "tag_name": tag,
              "name": f"VK Notify {tag}",
              "body": body,
              "draft": False,
              "prerelease": False,
          }).encode("utf-8")

          req = urllib.request.Request(
              f"{api_url}/repos/{repo}/releases",
              data=payload,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "User-Agent": "ha-vk-notify-plus-release",
              },
              method="POST",
          )

          release_id = None
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  rel_data = json.loads(resp.read().decode("utf-8"))
                  release_id = rel_data.get("id")
                  print(f"Release {tag} created successfully (HTTP {resp.status}, id={release_id})")
          except urllib.error.HTTPError as err:
              if err.code in (409, 422):
                  print(f"Release {tag} already exists (HTTP {err.code}), skipping creation")
              else:
                  raise

          if release_id:
              up_req = urllib.request.Request(
                  f"{api_url}/repos/{repo}/releases/{release_id}/assets?name=vk_notify.zip",
                  data=zip_bytes,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/zip",
                      "Accept": "application/json",
                      "User-Agent": "ha-vk-notify-plus-release",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(up_req, timeout=30) as up_resp:
                  print(f"Uploaded vk_notify.zip ({len(zip_bytes)} bytes, HTTP {up_resp.status})")
          EOF
